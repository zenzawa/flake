# Celluloid / mpv input configuration
# Audio normalization toggles

# - : EBU R128 loudness normalization (target -16 LUFS)
- af toggle "lavfi=[loudnorm=i=-16]"; show-text "loudnorm enabled"

# _ : Dynamic audio normalizer (adapts volume over time)
_ af toggle "dynaudnorm=g=5:f=250:r=0.9:p=0.5"; show-text "dynaudnorm enabled"

# = : Compressor followed by loudnorm (tames loud peaks + normalizes)
= af toggle "acompressor=ratio=4,loudnorm"; show-text "acompressor,loudnorm enabled"

# + : Limiter (prevents clipping)
+ af toggle "lavfi=[alimiter=10:1:1:5:8000]"; show-text "alimiter enabled"
